name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode*.app/Contents/Developer || true
          xcodebuild -version

      - name: Resolve project
        run: |
          cd ChameleonUltra-iOS
          xcodebuild -project ChameleonUltra.xcodeproj -scheme ChameleonUltra -showBuildSettings -quiet > /dev/null

      - name: Build (Release, no code signing)
        run: |
          cd ChameleonUltra-iOS
          xcodebuild \
            -project ChameleonUltra.xcodeproj \
            -scheme ChameleonUltra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build | tail -40

      - name: Package IPA (ad-hoc signed for sideload tools)
        run: |
          cd ChameleonUltra-iOS
          APP="build/Build/Products/Release-iphoneos/ChameleonUltra.app"
          # Ad-hoc signature lets TrollStore install directly; AltStore/Sideloadly re-sign anyway.
          codesign -f -s - --generate-entitlement-der "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ChameleonUltra.ipa Payload
          unzip -l ChameleonUltra.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChameleonUltra-ipa
          path: ChameleonUltra-iOS/ChameleonUltra.ipa
          retention-days: 30
