name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, no code signing)
        run: |
          xcodebuild \
            -project ChameleonUltra.xcodeproj \
            -scheme ChameleonUltra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tail -60

      - name: Package IPA (ad-hoc signed for sideload tools)
        run: |
          APP="build/Build/Products/Release-iphoneos/ChameleonUltra.app"
          # Ad-hoc signature lets TrollStore install directly; AltStore/Sideloadly re-sign anyway.
          codesign -f -s - --generate-entitlement-der "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ChameleonUltra.ipa Payload
          unzip -l ChameleonUltra.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChameleonUltra-ipa
          path: ChameleonUltra.ipa
          retention-days: 30
