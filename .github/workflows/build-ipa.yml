name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Guard against duplicate L10n keys (crashes at launch)
        run: |
          python3 - <<'EOF'
          import re, sys, collections
          text = open('ChameleonUltra/L10n.swift', encoding='utf-8').read()
          keys = re.findall(r'^\s+"([^"]+)":', text, re.M)
          dupes = [k for k, c in collections.Counter(keys).items() if c > 1]
          if dupes:
              print(f"::error::Duplicate L10n keys (dictionary literal traps at launch): {dupes}")
              sys.exit(1)
          print(f"L10n OK: {len(keys)} unique keys")
          EOF

      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ChameleonUltra.xcodeproj \
            -scheme ChameleonUltra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tail -60

      - name: Package IPA (ad-hoc signed for sideload tools)
        run: |
          APP="build/Build/Products/Release-iphoneos/ChameleonUltra.app"
          # Ad-hoc signature lets TrollStore install directly; AltStore/Sideloadly re-sign anyway.
          # Sign embedded extensions first, then the app itself. Entitlements carry the
          # App Group so the device-status widget can read the shared snapshot.
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -name "*.appex" -exec codesign -f -s - --entitlements ChameleonWidget.entitlements --generate-entitlement-der {} \;
          fi
          codesign -f -s - --entitlements ChameleonUltra.entitlements --generate-entitlement-der "$APP" || true
          codesign -d --entitlements - "$APP" 2>&1 | head -20 || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ChameleonUltra.ipa Payload
          unzip -l ChameleonUltra.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChameleonUltra-ipa
          path: ChameleonUltra.ipa
          retention-days: 30
